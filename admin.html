<!-- Script Admin con Notificaciones en Segundo Plano -->
<script>
  const adminApp = {
    lastKnownCount: 0,

    init() {
      if (sessionStorage.getItem('nx_admin_auth') === 'true') {
        document.getElementById('login-overlay').classList.add('hidden');
        this.requestNotificationPermission();
        this.loadRequests();
        this.startMonitoring();
      }
    },

    // Pedir permiso de notificaciones al navegador
    async requestNotificationPermission() {
      if ('Notification' in window && Notification.permission === 'default') {
        try {
          await Notification.requestPermission();
        } catch (e) {
          console.log('Error al solicitar permiso de notificaciones:', e);
        }
      }
    },

    login() {
      const pass = document.getElementById('admin-pass').value;
      if (pass === 'admin123') {
        sessionStorage.setItem('nx_admin_auth', 'true');
        document.getElementById('login-overlay').classList.add('hidden');
        this.requestNotificationPermission();
        this.loadRequests();
        this.startMonitoring();
      } else {
        alert('Clave incorrecta');
      }
    },

    logout() {
      sessionStorage.removeItem('nx_admin_auth');
      window.location.reload();
    },

    // Emitir sonido de alerta sonora utilizando Web Audio API
    playAlertSound() {
      try {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();

        osc.type = 'sine';
        osc.frequency.setValueAtTime(587.33, audioCtx.currentTime); // Tono D5
        osc.frequency.exponentialRampToValueAtTime(880, audioCtx.currentTime + 0.2); // Tono A5

        gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);

        osc.connect(gain);
        gain.connect(audioCtx.destination);

        osc.start();
        osc.stop(audioCtx.currentTime + 0.4);
      } catch (e) {
        console.log('No se pudo reproducir el sonido:', e);
      }
    },

    // Enviar notificación flotante del sistema/dispositivo
    triggerNotification(request) {
      this.playAlertSound();

      if ('Notification' in window && Notification.permission === 'granted') {
        const title = `🚨 Nuevo Pedido de Link: ${request.id}`;
        const options = {
          body: `Cliente: ${request.name}\nMonto: $${request.amount || '0'}\nTipo: ${request.category === 'transfers' ? 'Reintegro' : 'Pago Resumen'}`,
          icon: 'https://cdn-icons-png.flaticon.com/512/1827/1827504.png',
          requireInteraction: true
        };

        const notification = new Notification(title, options);
        notification.onclick = function() {
          window.focus();
          notification.close();
        };
      }
    },

    // Iniciar el monitoreo en segundo plano
    startMonitoring() {
      // 1. Monitoreo por evento de cambio en Storage (inter-pestañas en tiempo real)
      window.addEventListener('storage', (e) => {
        if (e.key === 'nx_platform_requests') {
          this.checkNewRequests();
        }
      });

      // 2. Polling periódico cada 3 segundos
      setInterval(() => {
        this.checkNewRequests();
      }, 3000);
    },

    checkNewRequests() {
      const requests = JSON.parse(localStorage.getItem('nx_platform_requests') || '[]');
      
      if (requests.length > this.lastKnownCount && this.lastKnownCount !== 0) {
        const latestRequest = requests[0];
        this.triggerNotification(latestRequest);
      }

      this.lastKnownCount = requests.length;
      this.loadRequests();
    },

    loadRequests() {
      const tbody = document.getElementById('admin-table-body');
      const emptyState = document.getElementById('admin-empty-state');
      const requests = JSON.parse(localStorage.getItem('nx_platform_requests') || '[]');

      this.lastKnownCount = requests.length;
      tbody.innerHTML = '';

      if (requests.length === 0) {
        emptyState.classList.remove('hidden');
        return;
      }

      emptyState.classList.add('hidden');

      requests.forEach((req) => {
        const tr = document.createElement('tr');
        tr.className = 'hover:bg-slate-50/70 transition';
        
        let badgeColor = 'bg-amber-100 text-amber-800';
        if (req.status === 'Link Generado') badgeColor = 'bg-emerald-100 text-emerald-800';
        if (req.category === 'transfers') badgeColor = 'bg-nxPurple-100 text-nxPurple-800';

        const banksDisplay = (req.selectedBanks && req.selectedBanks.length > 0)
          ? `<div class="flex flex-wrap gap-1">${req.selectedBanks.map(b => `<span class="bg-slate-100 text-slate-800 text-[10px] font-bold px-2 py-0.5 rounded-md border border-slate-200">${b}</span>`).join('')}</div>`
          : '<span class="text-xs text-slate-400 italic">Sin cuentas asociadas</span>';

        tr.innerHTML = `
          <td class="p-4 font-mono font-bold text-xs text-nxPurple-900">${req.id}</td>
          <td class="p-4">
            <div class="font-bold text-slate-900">${req.name}</div>
            <div class="text-xs text-slate-500">DNI: ${req.dni} | Tel: ${req.phone}</div>
          </td>
          <td class="p-4">
            <div class="text-xs font-bold uppercase text-slate-500">${req.category === 'transfers' ? 'Reintegro / Acreditación' : 'Pago de Resumen'}</div>
            <div class="font-extrabold text-nxOrange-600">$${req.amount || '0'} <span class="text-xs font-normal text-slate-500">(${req.paymentType || 'N/A'})</span></div>
          </td>
          <td class="p-4 max-w-xs">
            ${banksDisplay}
          </td>
          <td class="p-4">
            <span class="px-2.5 py-1 rounded-full text-xs font-bold ${badgeColor}">${req.status}</span>
          </td>
          <td class="p-4">
            <input type="url" id="url-${req.id}" value="${req.paymentUrl || ''}" placeholder="https://link.naranjax.com/..." class="w-full px-3 py-2 bg-slate-50 border border-slate-300 rounded-lg text-xs focus:outline-none focus:border-nxOrange-500 transition">
          </td>
          <td class="p-4 text-right">
            <button onclick="adminApp.savePaymentUrl('${req.id}')" class="bg-nxOrange-500 hover:bg-nxOrange-600 text-white font-bold px-3.5 py-2 rounded-lg text-xs transition shadow-sm">
              Guardar
            </button>
          </td>
        `;
        tbody.appendChild(tr);
      });
    },

    savePaymentUrl(id) {
      const urlInput = document.getElementById(`url-${id}`);
      const newUrl = urlInput.value.trim();
      let requests = JSON.parse(localStorage.getItem('nx_platform_requests') || '[]');
      
      requests = requests.map(req => {
        if (req.id === id) {
          req.paymentUrl = newUrl;
          if (newUrl) req.status = 'Link Generado';
        }
        return req;
      });

      localStorage.setItem('nx_platform_requests', JSON.stringify(requests));
      alert(`¡Enlace guardado correctamente para el pedido ${id}!`);
      this.loadRequests();
    }
  };

  document.addEventListener('DOMContentLoaded', () => adminApp.init());
</script>
